[project]
name = "annotation-tool"
version = "5.0.0"
description = "Egyptian Arabic audio annotation platform (PostgreSQL backend)"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "gunicorn>=21.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "soundfile>=0.12",
    "openpyxl>=3.1",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pgserver>=0.1",
    "pytest-playwright>=0.9.0",
]
preprocess = [
    "torch>=2.6",
    "torchaudio>=2.6",
    "silero-vad>=6.0",
    "dashscope>=1.20",
]

[tool.uv]
# CPU-only PyTorch wheels — this server has no GPU; keeps the env ~200MB instead of multi-GB CUDA builds
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
