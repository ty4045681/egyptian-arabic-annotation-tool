# /etc/nginx/sites-available/annotation-tool
# Cloudflare Tunnel origin: http://127.0.0.1:8080
# This file is included from nginx's `http` context. Cloudflare overwrites the
# header before the request reaches this loopback-only origin.
map $http_cf_connecting_ip $annotation_admin_limit_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $annotation_admin_limit_key zone=annotation_admin_login:10m rate=5r/m;

server {
    listen 127.0.0.1:8080;
    server_name _;

    client_max_body_size 2m;

    location = /api/admin/login {
        limit_req zone=annotation_admin_login burst=5 nodelay;
        limit_req_status 429;
        add_header Retry-After 60 always;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This origin is reachable only through the local Cloudflare Tunnel.
        # Cloudflare overwrites CF-Connecting-IP with the verified client IP.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Flask validates the signed session and path first, then emits
    # X-Accel-Redirect: /_protected_audio/<relative path>.
    # `internal` prevents direct public access that bypasses authentication.
    location /_protected_audio/ {
        internal;
        alias /home/ck/ar_audios/;
        sendfile on;
        tcp_nopush on;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, max-age=3600" always;
    }
}
