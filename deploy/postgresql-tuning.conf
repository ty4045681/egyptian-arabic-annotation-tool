# Review against actual RAM before copying to postgresql.conf.
# Host observed during development: 64 GiB RAM, 32 CPU threads.
max_connections = 150
shared_buffers = 8GB
effective_cache_size = 32GB
maintenance_work_mem = 1GB
work_mem = 16MB
wal_compression = on
checkpoint_completion_target = 0.9
min_wal_size = 2GB
max_wal_size = 8GB
random_page_cost = 1.1
effective_io_concurrency = 200
log_min_duration_statement = 500
log_lock_waits = on
deadlock_timeout = 1s
