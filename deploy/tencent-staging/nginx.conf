# SSH tunnel only: ssh -N -L 18080:127.0.0.1:8080 ubuntu@43.165.0.67
# Included inside nginx's http context. No Cloudflare proxy is assumed.
limit_req_zone $binary_remote_addr zone=annotation_staging_admin:10m rate=5r/m;

server {
    listen 127.0.0.1:8080;
    server_name _;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /api/admin/login {
        limit_req zone=annotation_staging_admin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
    }

    location /_protected_audio/ {
        internal;
        alias /data/annotation/staging-audio/;
        sendfile on;
        tcp_nopush on;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, max-age=3600" always;
    }
}
